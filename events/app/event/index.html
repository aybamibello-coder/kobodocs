<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Workspace | KoboDocs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .ev-wrap{ max-width:900px; margin:0 auto; padding:28px 20px 100px; }
  .ev-top{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px; margin-bottom:18px; }
  .ev-back{ font-size:0.82rem; opacity:0.6; }
  .ev-badge{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; padding:3px 9px; border-radius:12px; }
  .ev-badge.active{ background:rgba(199,154,60,0.18); color:var(--stamp-gold); }
  .ev-badge.none{ background:rgba(20,52,43,0.08); opacity:0.7; }
  .ev-tabs{ display:flex; gap:6px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:20px; padding-bottom:0; }
  .ev-tabs button{ font-size:0.85rem; border:none; background:none; padding:10px 14px; cursor:pointer; font-family:inherit; opacity:0.6; border-bottom:2px solid transparent; }
  .ev-tabs button.active{ opacity:1; border-bottom-color:var(--stamp-gold); font-weight:600; }
  .ev-panel{ background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:20px; margin-bottom:16px; }
  .ev-row{ display:flex; justify-content:space-between; align-items:center; gap:14px; padding:12px 0; border-bottom:1px dashed var(--line); flex-wrap:wrap; }
  .ev-row:last-child{ border-bottom:none; }
  .ev-name{ font-weight:600; }
  .ev-meta{ font-size:0.8rem; opacity:0.6; }
  .btn{ font-size:0.85rem; border:1px solid var(--line); background:none; border-radius:20px; padding:7px 16px; cursor:pointer; font-family:inherit; text-decoration:none; color:inherit; display:inline-block; }
  .btn.primary{ background:var(--ink-green-deep); color:var(--paper); border-color:var(--ink-green-deep); }
  .btn.small{ padding:4px 12px; font-size:0.78rem; }
  .btn.danger{ color:var(--stamp-red); border-color:var(--stamp-red); }
  .empty-note{ font-size:0.88rem; opacity:0.6; padding:20px 0; text-align:center; }
  .ev-form-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .ev-form-row input, .ev-form-row select, .ev-panel input, .ev-panel select, .ev-panel textarea{ width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-family:inherit; font-size:0.88rem; }
  .ev-panel label{ font-size:0.78rem; opacity:0.7; display:block; margin-bottom:3px; }
  .status-pill{ font-size:0.72rem; padding:2px 8px; border-radius:10px; }
  .status-pill.attending{ background:rgba(20,120,80,0.14); color:#147850; }
  .status-pill.not_attending{ background:rgba(168,52,42,0.1); color:var(--stamp-red); }
  .status-pill.pending{ background:rgba(20,52,43,0.08); opacity:0.7; }
  .lock-panel{ text-align:center; padding:40px 20px; }
  .lock-panel .price{ font-family:'Fraunces', serif; font-size:1.6rem; margin:10px 0; }
  .summary-strip{ display:flex; gap:20px; flex-wrap:wrap; margin-bottom:16px; }
  .summary-strip div{ font-size:0.82rem; }
  .summary-strip strong{ display:block; font-family:'Fraunces', serif; font-size:1.15rem; }
  #toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink-green-deep); color:var(--paper); padding:10px 20px; border-radius:6px; font-size:0.85rem; display:none; z-index:50; }
  #qrHolder{ display:flex; justify-content:center; margin:14px 0; }
</style>
</head>
<body>

<header>
  <nav class="nav">
    <a href="/" class="logo">
      <svg class="mark" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14" stroke="#C79A3C" stroke-width="2.5"/>
        <circle cx="16" cy="16" r="8" stroke="#C79A3C" stroke-width="1.5"/>
      </svg>
      KoboDocs
    </a>
    <button class="search-btn" id="searchBtn" aria-label="Search tools">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="menu-btn" aria-label="Toggle menu" id="menuBtn"><span></span><span></span><span></span></button>
    <div class="nav-links" id="navLinks">
      <a href="/" class="mobile-only-link">Home</a>
      <a href="/events/app/">Your events</a>
      <a href="/blog/" class="mobile-only-link">Blog</a>
      <a href="/about/" class="mobile-only-link">About</a>
      <a href="/account/" id="navAccountLink">Sign in</a>
    </div>
  </nav>
</header>

<div class="search-overlay" id="searchOverlay">
  <div class="search-panel">
    <div class="search-panel-head">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search tools — e.g. invoice, will, visa, siwes..." autocomplete="off">
      <button class="search-close" id="searchClose" aria-label="Close search">&times;</button>
    </div>
    <div class="search-results" id="searchResults"></div>
    <div class="search-hint">↑↓ to navigate · Enter to open · Esc to close</div>
  </div>
</div>

<div class="ev-wrap">
  <a href="/events/app/" class="ev-back">&larr; Your events</a>
  <div class="ev-top">
    <div>
      <h1 id="eventTitle" style="font-size:1.4rem;">Loading…</h1>
      <div class="ev-meta" id="eventMeta"></div>
    </div>
    <span class="ev-badge" id="passBadge"></span>
  </div>

  <div class="ev-tabs" id="evTabs">
    <button data-tab="overview" class="active">Overview &amp; Budget</button>
    <button data-tab="guests">Guests &amp; RSVP</button>
    <button data-tab="vendors" id="vendorsTabBtn">Vendors</button>
    <button data-tab="contributions">Contributions</button>
    <button data-tab="timeline">Timeline</button>
    <button data-tab="invitation">Invitation</button>
  </div>

  <div id="tabContent"><div class="empty-note">Loading…</div></div>
</div>

<div id="toast"></div>

<script type="module" src="/assets/auth.js"></script>
<script src="/assets/nav-auth.js" defer></script>
<script src="/assets/subscribe.js" defer></script>
<script src="/events/app/guard.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="/assets/export.js" defer></script>
<script src="/events/app/event/event-workspace.js" defer></script>
<script src="/assets/tools-index.js" defer></script>
<script src="/assets/search.js" defer></script>
</body>
</html>

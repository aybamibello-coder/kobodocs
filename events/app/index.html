<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Events | KoboDocs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .ev-wrap{ max-width:900px; margin:0 auto; padding:36px 20px 100px; }
  .ev-top{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px; margin-bottom:24px; }
  .ev-card{ background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:18px 20px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; }
  .ev-card-name{ font-weight:600; margin-bottom:4px; }
  .ev-card-meta{ font-size:0.82rem; opacity:0.65; }
  .ev-badge{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; padding:3px 9px; border-radius:12px; }
  .ev-badge.active{ background:rgba(199,154,60,0.18); color:var(--stamp-gold); }
  .ev-badge.none{ background:rgba(20,52,43,0.08); opacity:0.7; }
  .btn{ font-size:0.85rem; border:1px solid var(--line); background:none; border-radius:20px; padding:7px 16px; cursor:pointer; font-family:inherit; text-decoration:none; color:inherit; display:inline-block; }
  .btn.primary{ background:var(--ink-green-deep); color:var(--paper); border-color:var(--ink-green-deep); }
  .empty-note{ font-size:0.88rem; opacity:0.6; padding:30px 0; text-align:center; }
  .ev-form{ background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:20px; margin-bottom:24px; display:none; }
  .ev-form.show{ display:block; }
  .ev-form input, .ev-form select{ width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-family:inherit; font-size:0.9rem; margin-bottom:10px; }
  .ev-form label{ font-size:0.78rem; opacity:0.7; display:block; margin-bottom:3px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .type-tabs{ display:flex; gap:8px; margin-bottom:14px; }
  .type-tabs button{ font-size:0.82rem; border:1px solid var(--line); background:none; border-radius:20px; padding:6px 14px; cursor:pointer; font-family:inherit; }
  .type-tabs button.active{ background:var(--ink-green-deep); color:var(--paper); border-color:var(--ink-green-deep); }
  #toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink-green-deep); color:var(--paper); padding:10px 20px; border-radius:6px; font-size:0.85rem; display:none; z-index:50; }
</style>
</head>
<body>

<header>
  <nav class="nav">
    <a href="/" class="logo">
      <svg class="mark" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14" stroke="#C79A3C" stroke-width="2.5"/>
        <circle cx="16" cy="16" r="8" stroke="#C79A3C" stroke-width="1.5"/>
      </svg>
      KoboDocs
    </a>
    <button class="search-btn" id="searchBtn" aria-label="Search tools">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="menu-btn" aria-label="Toggle menu" id="menuBtn"><span></span><span></span><span></span></button>
    <div class="nav-links" id="navLinks">
      <a href="/" class="mobile-only-link">Home</a>
      <a href="/events/">Events home</a>
      <a href="/wedding-budget-planner/">Wedding Budget Planner</a>
      <a href="/blog/" class="mobile-only-link">Blog</a>
      <a href="/about/" class="mobile-only-link">About</a>
      <a href="/account/" id="navAccountLink">Sign in</a>
    </div>
  </nav>
</header>

<div class="search-overlay" id="searchOverlay">
  <div class="search-panel">
    <div class="search-panel-head">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search tools — e.g. invoice, will, visa, siwes..." autocomplete="off">
      <button class="search-close" id="searchClose" aria-label="Close search">&times;</button>
    </div>
    <div class="search-results" id="searchResults"></div>
    <div class="search-hint">↑↓ to navigate · Enter to open · Esc to close</div>
  </div>
</div>

<div class="ev-wrap">
  <div class="ev-top">
    <div>
      <h1 style="font-size:1.4rem;">Your Events</h1>
      <p style="font-size:0.88rem; opacity:0.7; margin-top:4px;">Weddings, naming ceremonies, and funerals — budget, guests, RSVP, and more, in one place per event.</p>
    </div>
    <button class="btn primary" id="newEventBtn">+ New event</button>
  </div>

  <div class="ev-form" id="newEventForm">
    <label>Event type</label>
    <div class="type-tabs" id="typeTabs">
      <button type="button" class="active" data-type="wedding">Wedding — ₦7,500</button>
      <button type="button" data-type="naming">Naming Ceremony — ₦2,000</button>
      <button type="button" data-type="funeral">Funeral / Memorial — ₦3,500</button>
    </div>
    <label for="eventName">Event name</label>
    <input type="text" id="eventName" placeholder="e.g. Chidinma &amp; Emeka's Wedding">
    <div class="form-grid">
      <div>
        <label for="eventDate">Event date</label>
        <input type="date" id="eventDate">
      </div>
      <div>
        <label for="cityTier">City tier</label>
        <select id="cityTier">
          <option value="premium">Premium (Lagos Island, Abuja Central)</option>
          <option value="mid" selected>Mid-tier (most major cities)</option>
          <option value="budget">Budget-friendly (smaller cities/towns)</option>
        </select>
      </div>
    </div>
    <label for="guestCount">Expected guest count</label>
    <input type="text" id="guestCount" placeholder="150">
    <div style="display:flex; gap:10px; margin-top:6px;">
      <button class="btn primary" id="createEventBtn">Create event</button>
      <button class="btn" id="cancelEventBtn">Cancel</button>
    </div>
  </div>

  <div id="eventsList"><div class="empty-note">Loading…</div></div>
</div>

<div id="toast"></div>

<script type="module" src="/assets/auth.js"></script>
<script src="/assets/nav-auth.js" defer></script>
<script src="/events/app/guard.js" defer></script>
<script src="/events/app/events-dashboard.js" defer></script>
<script src="/assets/tools-index.js" defer></script>
<script src="/assets/search.js" defer></script>
</body>
</html>

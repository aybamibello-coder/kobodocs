<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receivable Manager | KoboDocs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .pr-wrap{ max-width:980px; margin:0 auto; padding:36px 20px 100px; }
  .pr-top{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px; margin-bottom:24px; }
  .bs-panel{ background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:22px 20px; margin-bottom:20px; }
  .pr-row{ display:flex; justify-content:space-between; align-items:center; gap:14px; padding:14px 0; border-bottom:1px dashed var(--line); flex-wrap:wrap; }
  .pr-row:last-child{ border-bottom:none; }
  .pr-name{ font-weight:600; }
  .pr-meta{ font-size:0.82rem; opacity:0.65; }
  .pr-amount{ font-family:'Fraunces', serif; font-size:1.05rem; }
  .btn{ font-size:0.85rem; border:1px solid var(--line); background:none; border-radius:20px; padding:7px 16px; cursor:pointer; }
  .btn.primary{ background:var(--ink-green-deep); color:var(--paper); border-color:var(--ink-green-deep); }
  .btn.small{ padding:5px 12px; font-size:0.78rem; }
  .empty-note{ font-size:0.88rem; opacity:0.6; padding:20px 0; text-align:center; }
  .pr-form input, .pr-form select, .pr-form textarea{ width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-family:inherit; font-size:0.9rem; margin-bottom:10px; }
  .pr-form label{ font-size:0.78rem; opacity:0.7; display:block; margin-bottom:3px; }
  #entryForm input, #entryForm select{ width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-family:inherit; font-size:0.9rem; margin-bottom:10px; }
  #entryForm label{ font-size:0.78rem; opacity:0.7; display:block; margin-bottom:3px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .plan-card{ border:1px solid var(--line); border-radius:8px; padding:18px; text-align:center; }
  .plan-card h3{ font-family:'Fraunces', serif; font-size:1.1rem; margin-bottom:6px; }
  .plan-price{ font-size:1.3rem; margin-bottom:12px; }
  .plans-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:14px; }
  #toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink-green-deep); color:var(--paper); padding:10px 20px; border-radius:6px; font-size:0.85rem; display:none; z-index:50; }
</style>
</head>
<body>

<header>
  <nav class="nav">
    <a href="/" class="logo">
      <svg class="mark" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14" stroke="#C79A3C" stroke-width="2.5"/>
        <circle cx="16" cy="16" r="8" stroke="#C79A3C" stroke-width="1.5"/>
      </svg>
      KoboDocs
    </a>
    <button class="search-btn" id="searchBtn" aria-label="Search tools">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="menu-btn" aria-label="Toggle menu" id="menuBtn"><span></span><span></span><span></span></button>
    <div class="nav-links" id="navLinks">
      <a href="/" class="mobile-only-link">Home</a>
      <a href="/business-suite/app/">Business Suite</a>
      <a href="/payroll/app/">Payroll</a>
      <a href="/esign/app/">e-Signature</a>
      <a href="/blog/" class="mobile-only-link">Blog</a>
      <a href="/about/" class="mobile-only-link">About</a>
      <a href="/account/" id="navAccountLink">Sign in</a>
    </div>
  </nav>
</header>

<div class="search-overlay" id="searchOverlay">
  <div class="search-panel">
    <div class="search-panel-head">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search tools — e.g. invoice, will, visa, siwes..." autocomplete="off">
      <button class="search-close" id="searchClose" aria-label="Close search">&times;</button>
    </div>
    <div class="search-results" id="searchResults"></div>
    <div class="search-hint">↑↓ to navigate · Enter to open · Esc to close</div>
  </div>
</div>

<div class="pr-wrap">
  <div class="pr-top">
    <div>
      <h1 style="font-size:1.4rem;">Receivable Manager</h1>
      <p style="font-size:0.88rem; opacity:0.7; margin-top:4px;">Track outstanding balances, chase overdue payments, and see your DSO at a glance.</p>
    </div>
  </div>

  <div id="mainArea"><div class="empty-note">Loading…</div></div>
</div>

<div id="toast"></div>

<script type="module" src="/assets/auth.js"></script>
<script src="/assets/nav-auth.js" defer></script>
<script src="/assets/subscribe.js"></script>
<script src="/assets/export.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<script src="/receivable-manager/app/guard.js"></script>
<script src="/receivable-manager/app/receivable.js"></script>
<script src="/assets/tools-index.js" defer></script>
<script src="/assets/search.js" defer></script>
</body>
</html>

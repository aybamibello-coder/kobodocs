<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cancel Booking | KoboDocs</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  body{ background:var(--bone); }
  .fill-wrap{ max-width:480px; margin:0 auto; padding:60px 20px; }
  .fill-card{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:28px 26px; text-align:center; }
  .fill-title{ font-family:'Fraunces', serif; font-size:1.3rem; font-weight:600; margin-bottom:10px; }
  .fill-desc{ font-size:0.92rem; opacity:0.8; margin-bottom:20px; }
  .fill-submit{ padding:11px 24px; border:none; border-radius:24px; background:var(--stamp-red); color:#fff; font-size:0.92rem; cursor:pointer; font-family:inherit; }
  .fill-submit:disabled{ opacity:0.6; }
</style>
</head>
<body>
  <div class="fill-wrap">
    <div class="fill-card" id="card">
      <div class="fill-desc">Loading…</div>
    </div>
  </div>
  <script type="module" src="/booking/cancel/cancel.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reschedule Booking | KoboDocs</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  body{ background:var(--bone); }
  .fill-wrap{ max-width:480px; margin:0 auto; padding:60px 20px; }
  .fill-card{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:28px 26px; }
  .fill-title{ font-family:'Fraunces', serif; font-size:1.3rem; font-weight:600; margin-bottom:10px; text-align:center; }
  .fill-desc{ font-size:0.92rem; opacity:0.8; margin-bottom:20px; text-align:center; }
  .fill-submit{ width:100%; padding:12px; border:none; border-radius:24px; background:var(--ink-green-deep); color:var(--paper); font-size:0.95rem; cursor:pointer; font-family:inherit; margin-top:8px; }
  .fill-submit:disabled{ opacity:0.6; cursor:default; }
  .day-picker{ display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:16px; }
  .day-btn{ flex:0 0 auto; border:1px solid var(--line); border-radius:8px; padding:8px 12px; background:var(--paper); cursor:pointer; font-family:inherit; font-size:0.8rem; text-align:center; }
  .day-btn.active{ background:var(--ink-green-deep); color:var(--paper); border-color:var(--ink-green-deep); }
  .day-btn .dow{ display:block; font-size:0.68rem; opacity:0.6; }
  .slot-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(85px, 1fr)); gap:8px; margin-bottom:10px; }
  .slot-btn{ border:1px solid var(--line); border-radius:6px; padding:8px 6px; background:var(--paper); cursor:pointer; font-family:inherit; font-size:0.82rem; }
  .slot-btn:hover, .slot-btn.selected{ background:var(--ink-green-deep); color:var(--paper); border-color:var(--ink-green-deep); }
  .empty-note{ font-size:0.88rem; opacity:0.6; padding:20px 0; text-align:center; }
  .current-time-box{ background:rgba(0,0,0,0.03); border-radius:8px; padding:12px 14px; font-size:0.85rem; margin-bottom:18px; text-align:center; }
</style>
</head>
<body>
  <div class="fill-wrap">
    <div class="fill-card" id="card">
      <div class="fill-desc">Loading…</div>
    </div>
  </div>
  <script type="module" src="/booking/reschedule/reschedule.js"></script>
</body>
</html>

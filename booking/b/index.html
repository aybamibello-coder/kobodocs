<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an appointment | KoboDocs</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  body{ background:var(--bone); }
  .fill-wrap{ max-width:560px; margin:0 auto; padding:48px 20px 90px; }
  .fill-card{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:28px 26px; }
  .fill-logo{ font-family:'Space Mono', monospace; font-size:0.75rem; letter-spacing:0.06em; opacity:0.5; margin-bottom:14px; text-transform:uppercase; }
  .fill-title{ font-family:'Fraunces', serif; font-size:1.5rem; font-weight:600; margin-bottom:6px; }
  .fill-desc{ font-size:0.9rem; opacity:0.75; margin-bottom:22px; }
  .fill-field{ margin-bottom:18px; }
  .fill-field label{ display:block; font-size:0.85rem; font-weight:600; margin-bottom:6px; }
  .fill-field .req{ color:var(--stamp-red); }
  .fill-field input[type=text], .fill-field input[type=tel], .fill-field input[type=email], .fill-field textarea, .fill-field select{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font-family:inherit; font-size:0.92rem; background:var(--paper);
  }
  .service-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:10px; }
  .service-card{ border:1px solid var(--line); border-radius:8px; padding:14px 16px; cursor:pointer; text-align:left; background:var(--paper); font-family:inherit; }
  .service-card:hover{ border-color:var(--ink-green-deep); }
  .service-card .name{ font-weight:600; font-size:0.98rem; }
  .service-card .meta{ font-size:0.82rem; opacity:0.65; margin-top:3px; }
  .service-card .desc{ font-size:0.85rem; opacity:0.75; margin-top:6px; }
  .day-picker{ display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:16px; }
  .day-btn{ flex:0 0 auto; border:1px solid var(--line); border-radius:8px; padding:8px 12px; background:var(--paper); cursor:pointer; font-family:inherit; font-size:0.8rem; text-align:center; }
  .day-btn.active{ background:var(--ink-green-deep); color:var(--paper); border-color:var(--ink-green-deep); }
  .day-btn .dow{ display:block; font-size:0.68rem; opacity:0.6; }
  .slot-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(85px, 1fr)); gap:8px; margin-bottom:10px; }
  .slot-btn{ border:1px solid var(--line); border-radius:6px; padding:8px 6px; background:var(--paper); cursor:pointer; font-family:inherit; font-size:0.82rem; }
  .slot-btn:hover, .slot-btn.selected{ background:var(--ink-green-deep); color:var(--paper); border-color:var(--ink-green-deep); }
  .back-link{ font-size:0.82rem; opacity:0.6; cursor:pointer; display:inline-block; margin-bottom:14px; }
  .fill-submit{ width:100%; padding:12px; border:none; border-radius:24px; background:var(--ink-green-deep); color:var(--paper); font-size:0.95rem; cursor:pointer; font-family:inherit; margin-top:8px; }
  .fill-submit:disabled{ opacity:0.6; cursor:default; }
  .fill-error{ color:var(--stamp-red); font-size:0.85rem; margin-top:8px; display:none; }
  .fill-success{ text-align:center; padding:30px 0 10px; }
  .fill-success h2{ font-family:'Fraunces', serif; font-size:1.35rem; margin-bottom:14px; }
  .success-check{ width:52px; height:52px; line-height:52px; border-radius:50%; background:var(--ink-green-deep); color:#fff; font-size:1.4rem; margin:0 auto 18px; }
  .success-detail{ opacity:0.85; font-size:0.95rem; line-height:1.6; margin-bottom:16px; }
  .success-message{ opacity:0.7; font-size:0.9rem; margin-bottom:24px; }
  .cancel-link{ opacity:0.55; font-size:0.78rem; margin-top:22px; }
  .contact-bar{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:20px 0 4px; }
  .deposit-box{ background:var(--bone); border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin:22px 0; text-align:left; font-size:0.85rem; }
  .deposit-box .lbl{ font-weight:600; margin-bottom:8px; display:block; }
  .deposit-box .row{ margin-bottom:4px; line-height:1.5; }
  .biz-info{ font-size:0.85rem; opacity:0.75; margin:18px 0; white-space:pre-wrap; line-height:1.5; }
  .empty-note{ font-size:0.88rem; opacity:0.6; padding:20px 0; text-align:center; }
  .contact-pill{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:20px; padding:8px 16px; font-size:0.82rem; text-decoration:none; color:inherit; background:var(--paper); }
  .contact-pill:hover{ border-color:var(--ink-green-deep); }
</style>
</head>
<body>
  <div class="fill-wrap">
    <div class="fill-card" id="fillCard">
      <div class="fill-logo">KoboDocs Booking</div>
      <div class="empty-note">Loading…</div>
    </div>
  </div>
  <script type="module" src="/booking/b/book.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survey | KoboDocs</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/assets/kobodocs-suite.css">
<style>
  body{ background:var(--bone); }
  .fill-wrap{ max-width:560px; margin:0 auto; padding:48px 20px 90px; }
  .fill-card{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:28px 26px; }
  .fill-logo{ font-family:'Space Mono', monospace; font-size:0.75rem; letter-spacing:0.06em; opacity:0.5; margin-bottom:14px; text-transform:uppercase; }
  .fill-title{ font-family:'Fraunces', serif; font-size:1.5rem; font-weight:600; margin-bottom:6px; }
  .fill-desc{ font-size:0.9rem; opacity:0.75; margin-bottom:22px; }
  .fill-field{ margin-bottom:20px; }
  .fill-field label.qlabel{ display:block; font-size:0.85rem; font-weight:600; margin-bottom:8px; }
  .fill-field .req{ color:var(--stamp-red); }
  .fill-field input[type=text], .fill-field textarea{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font-family:inherit; font-size:0.92rem; background:var(--paper);
  }
  .fill-choice-list label{ font-weight:400; display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:0.9rem; }
  .rating-stars{ display:flex; gap:6px; font-size:1.4rem; cursor:pointer; }
  .rating-stars span{ opacity:0.3; }
  .rating-stars span.active{ opacity:1; }
  .nps-scale{ display:flex; gap:4px; flex-wrap:wrap; }
  .nps-scale button{ width:32px; height:32px; border-radius:6px; border:1px solid var(--line); background:var(--paper); cursor:pointer; font-family:inherit; font-size:0.85rem; }
  .nps-scale button.active{ background:var(--ink-green-deep); color:var(--paper); border-color:var(--ink-green-deep); }
  .nps-hint{ display:flex; justify-content:space-between; font-size:0.72rem; opacity:0.55; margin-top:4px; }
  .likert-row{ display:flex; justify-content:space-between; gap:6px; flex-wrap:wrap; }
  .likert-opt{ flex:1; min-width:80px; text-align:center; font-size:0.72rem; opacity:0.75; }
  .likert-opt input{ display:block; margin:0 auto 4px; }
  .ranking-list{ list-style:none; padding:0; margin:0; }
  .ranking-list li{ display:flex; justify-content:space-between; align-items:center; background:rgba(20,52,43,0.05); border-radius:6px; padding:8px 10px; margin-bottom:6px; font-size:0.88rem; }
  .ranking-list .rank-btns button{ border:1px solid var(--line); background:none; border-radius:5px; width:26px; height:26px; cursor:pointer; margin-left:4px; }
  .matrix-grid-wrap{ overflow-x:auto; }
  .matrix-grid{ border-collapse:collapse; font-size:0.82rem; width:100%; }
  .matrix-grid th, .matrix-grid td{ border:1px solid var(--line); padding:6px 8px; text-align:center; }
  .matrix-grid th:first-child, .matrix-grid td:first-child{ text-align:left; font-weight:500; }
  .fill-submit{ width:100%; padding:12px; border:none; border-radius:24px; background:var(--ink-green-deep); color:var(--paper); font-size:0.95rem; cursor:pointer; font-family:inherit; margin-top:8px; }
  .fill-submit:disabled{ opacity:0.6; cursor:default; }
  .fill-error{ color:var(--stamp-red); font-size:0.85rem; margin-top:8px; display:none; }
  .fill-success{ text-align:center; padding:30px 0; }
  .fill-success h2{ font-family:'Fraunces', serif; font-size:1.3rem; margin-bottom:8px; }
</style>
</head>
<body>
  <div class="fill-wrap">
    <div class="fill-card" id="fillCard">
      <div class="fill-logo">KoboDocs Survey</div>
      <div class="empty-note">Loading…</div>
    </div>
  </div>
  <script type="module" src="/survey/s/fill.js"></script>
</body>
</html>

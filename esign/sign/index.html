<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign document | KoboDocs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .sign-wrap{ max-width:760px; margin:0 auto; padding:40px 20px 100px; }
  .bs-panel{ background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:22px 20px; margin-bottom:20px; }
  .btn{ font-size:0.9rem; border:1px solid var(--line); background:none; border-radius:20px; padding:9px 20px; cursor:pointer; }
  .btn.primary{ background:var(--ink-green-deep); color:var(--paper); border-color:var(--ink-green-deep); }
  .btn.danger{ border-color:var(--stamp-red); color:var(--stamp-red); }
  #pdfFrame{ width:100%; height:60vh; border:1px solid var(--line); border-radius:6px; margin-bottom:16px; }
  #sigPad{ border:1px solid var(--line); border-radius:6px; width:100%; height:150px; touch-action:none; background:#fff; }
  .sig-actions{ display:flex; gap:10px; margin-top:10px; }
  .empty-note{ text-align:center; padding:40px 0; opacity:0.7; }
</style>
</head>
<body>

<header>
  <nav class="nav">
    <a href="/" class="logo">
      <svg class="mark" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14" stroke="#C79A3C" stroke-width="2.5"/>
        <circle cx="16" cy="16" r="8" stroke="#C79A3C" stroke-width="1.5"/>
      </svg>
      KoboDocs
    </a>
  </nav>
</header>

<div class="sign-wrap">
  <div id="mainArea"><div class="empty-note">Loading…</div></div>
</div>

<script src="/esign/sign/sign.js"></script>
</body>
</html>

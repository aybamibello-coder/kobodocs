<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Forms | KoboDocs Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .fm-wrap{ max-width:900px; margin:0 auto; padding:36px 20px 100px; }
  .fm-top{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px; margin-bottom:24px; }
  .fm-card{ background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:18px 20px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; }
  .fm-card-name{ font-weight:600; margin-bottom:4px; }
  .fm-card-meta{ font-size:0.82rem; opacity:0.65; }
  .fm-badge{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; padding:3px 9px; border-radius:12px; }
  .fm-badge.published{ background:rgba(199,154,60,0.18); color:var(--stamp-gold); }
  .fm-badge.draft{ background:rgba(20,52,43,0.08); opacity:0.7; }
  .fm-badge.closed{ background:rgba(168,52,42,0.12); color:var(--stamp-red); }
  .btn{ font-size:0.85rem; border:1px solid var(--line); background:none; border-radius:20px; padding:7px 16px; cursor:pointer; font-family:inherit; text-decoration:none; color:inherit; display:inline-block; }
  .btn.primary{ background:var(--ink-green-deep); color:var(--paper); border-color:var(--ink-green-deep); }
  .empty-note{ font-size:0.88rem; opacity:0.6; padding:30px 0; text-align:center; }
  .fm-form{ background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:20px; margin-bottom:24px; display:none; }
  .fm-form.show{ display:block; }
  .fm-form input, .fm-form textarea{ width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-family:inherit; font-size:0.9rem; margin-bottom:10px; }
  .fm-form label{ font-size:0.78rem; opacity:0.7; display:block; margin-bottom:3px; }
  .plan-strip{ font-size:0.8rem; opacity:0.7; margin-bottom:18px; }
  #toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink-green-deep); color:var(--paper); padding:10px 20px; border-radius:6px; font-size:0.85rem; display:none; z-index:50; }
</style>
</head>
<body>

<header>
  <nav class="nav">
    <a href="/" class="logo">
      <svg class="mark" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14" stroke="#C79A3C" stroke-width="2.5"/>
        <circle cx="16" cy="16" r="8" stroke="#C79A3C" stroke-width="1.5"/>
      </svg>
      KoboDocs Form
    </a>
    <button class="search-btn" id="searchBtn" aria-label="Search tools">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="menu-btn" aria-label="Toggle menu" id="menuBtn"><span></span><span></span><span></span></button>
    <div class="nav-links" id="navLinks">
      <a href="/" class="mobile-only-link">Home</a>
      <a href="/forms/">Forms home</a>
      <a href="/survey/">KoboDocs Survey</a>
      <a href="/blog/" class="mobile-only-link">Blog</a>
      <a href="/about/" class="mobile-only-link">About</a>
      <a href="/account/" id="navAccountLink">Sign in</a>
    </div>
  </nav>
</header>

<div class="search-overlay" id="searchOverlay">
  <div class="search-panel">
    <div class="search-panel-head">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search tools — e.g. invoice, will, visa, siwes..." autocomplete="off">
      <button class="search-close" id="searchClose" aria-label="Close search">&times;</button>
    </div>
    <div class="search-results" id="searchResults"></div>
    <div class="search-hint">↑↓ to navigate · Enter to open · Esc to close</div>
  </div>
</div>

<div class="fm-wrap">
  <div class="fm-top">
    <div>
      <h1 style="font-size:1.4rem;">Your Forms</h1>
      <p style="font-size:0.88rem; opacity:0.7; margin-top:4px;">Build a form, publish it, share the link — responses land here.</p>
    </div>
    <button class="btn primary" id="newFormBtn">+ New form</button>
  </div>

  <div class="plan-strip" id="planStrip"></div>

  <div class="fm-form" id="newFormForm">
    <label for="formTitle">Form title</label>
    <input type="text" id="formTitle" placeholder="e.g. Vendor Onboarding Form">
    <label for="formDescription">Description (optional)</label>
    <textarea id="formDescription" rows="2" placeholder="Shown to people filling out the form"></textarea>
    <div style="display:flex; gap:10px; margin-top:6px;">
      <button class="btn primary" id="createFormBtn">Create form</button>
      <button class="btn" id="cancelFormBtn">Cancel</button>
    </div>
  </div>

  <div id="formsList"><div class="empty-note">Loading…</div></div>
</div>

<div id="toast"></div>

<script type="module" src="/assets/auth.js"></script>
<script src="/assets/nav-auth.js" defer></script>
<script src="/forms/app/guard.js" defer></script>
<script src="/forms/app/forms-dashboard.js" defer></script>
<script src="/assets/tools-index.js" defer></script>
<script src="/assets/search.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transcribe — KoboDocs</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/business-suite/app/shell.css">
<style>
  body{ background:var(--bone); }
  .tr-wrap{ max-width:1040px; margin:0 auto; padding:36px 20px 100px; }
  .tr-top{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px; margin-bottom:22px; }
  .plan-pill{
    display:inline-block; font-family:'Space Mono', monospace; font-size:0.68rem; text-transform:uppercase;
    letter-spacing:0.03em; padding:3px 10px; border-radius:20px; background:rgba(199,154,60,0.14); color:#8a6a1f; margin-top:6px;
  }
  .bs-panel{
    background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--stamp-gold);
    border-radius:6px; padding:22px 20px; margin-bottom:20px;
    box-shadow:0 1px 2px rgba(35,39,34,0.04), 0 8px 20px rgba(35,39,34,0.03);
  }
  .stats-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:20px; }
  .rm-stat{ background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:16px 14px; text-align:center; }
  .rm-stat-label{ font-family:'Space Mono', monospace; font-size:0.64rem; text-transform:uppercase; letter-spacing:0.04em; opacity:0.6; margin-bottom:6px; }
  .rm-stat-value{ font-family:'Fraunces', serif; font-size:1.5rem; color:var(--ink-green-deep); }
  .rm-stat.warn .rm-stat-value{ color:#8a6a1f; }

  .upload-zone{
    border:2px dashed var(--line); border-radius:8px; padding:36px 20px; text-align:center;
    cursor:pointer; transition:border-color .15s, background .15s;
  }
  .upload-zone:hover, .upload-zone.dragover{ border-color:var(--stamp-gold); background:rgba(199,154,60,0.04); }
  .upload-zone svg{ opacity:0.4; margin-bottom:10px; }
  .upload-zone p{ font-size:0.85rem; opacity:0.65; margin-top:6px; }

  .progress-card{ margin-top:14px; border:1px solid var(--line); border-radius:6px; padding:14px 16px; }
  .progress-card .pc-name{ font-size:0.85rem; font-weight:600; margin-bottom:8px; }
  .progress-track{ height:6px; background:var(--bone); border-radius:20px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--stamp-gold); border-radius:20px; width:0%; transition:width .2s ease; }
  .progress-fill.indeterminate{
    width:35%; animation:tr-indeterminate 1.3s ease-in-out infinite;
  }
  @keyframes tr-indeterminate{
    0%{ margin-left:-35%; } 100%{ margin-left:100%; }
  }
  .progress-status{ font-size:0.76rem; opacity:0.6; margin-top:6px; font-family:'Space Mono', monospace; }

  .file-card{
    display:flex; align-items:flex-start; gap:14px; padding:16px 4px;
    border-bottom:1px dashed var(--line); text-decoration:none; color:inherit;
  }
  .file-card:last-child{ border-bottom:none; }
  .file-icon{
    width:38px; height:38px; border-radius:8px; background:var(--bone); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:var(--ink-green-deep);
  }
  .file-info{ flex:1; min-width:0; }
  .file-name{ font-weight:600; font-size:0.92rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file-meta{ font-size:0.78rem; opacity:0.6; margin-top:2px; }
  .status-pill{
    font-family:'Space Mono', monospace; font-size:0.66rem; text-transform:uppercase;
    padding:3px 9px; border-radius:20px; display:inline-flex; align-items:center; gap:5px; flex-shrink:0;
  }
  .status-pill::before{ content:''; width:6px; height:6px; border-radius:50%; }
  .status-uploaded, .status-queued{ background:rgba(199,154,60,0.14); color:#8a6a1f; }
  .status-uploaded::before, .status-queued::before{ background:var(--stamp-gold); }
  .status-processing{ background:rgba(13,38,32,0.07); color:var(--ink-green-deep); }
  .status-processing::before{ background:var(--ink-green-deep); animation:tr-pulse 1.2s ease-in-out infinite; }
  @keyframes tr-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }
  .status-completed{ background:rgba(13,38,32,0.07); color:var(--ink-green-deep); }
  .status-completed::before{ background:var(--ink-green-deep); }
  .status-failed{ background:rgba(168,52,42,0.09); color:var(--stamp-red); }
  .status-failed::before{ background:var(--stamp-red); }
  .empty-note{ font-size:0.88rem; opacity:0.6; padding:20px 10px; text-align:center; }
  #toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink-green-deep); color:var(--paper); padding:10px 20px; border-radius:6px; font-size:0.85rem; display:none; z-index:50; }
  .btn{ font-size:0.85rem; border:1px solid var(--line); background:none; border-radius:20px; padding:7px 16px; cursor:pointer; }
  .btn.primary{ background:var(--stamp-gold); color:var(--ink-green-deep); border-color:var(--stamp-gold); font-weight:600; }
  .btn.small{ padding:5px 12px; font-size:0.78rem; }
  .upsell-strip{
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
    background:rgba(199,154,60,0.08); border:1px solid rgba(199,154,60,0.25); border-radius:6px;
    padding:12px 16px; margin-bottom:20px; font-size:0.85rem;
  }
</style>
</head>
<body class="suite-body">

<header>
  <nav class="nav suite-nav">
    <a href="/" class="logo">
      <svg class="mark" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14" stroke="#C79A3C" stroke-width="2.5"/>
        <circle cx="16" cy="16" r="8" stroke="#C79A3C" stroke-width="1.5"/>
      </svg>
      KoboDocs
    </a>
    <button class="search-btn" id="searchBtn" aria-label="Search tools">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="menu-btn" aria-label="Toggle menu" id="menuBtn"><span></span><span></span><span></span></button>
    <div class="nav-links" id="navLinks">
      <a href="/" class="mobile-only-link">Home</a>
      <a href="/transcribe/app/">My files</a>
      <a href="/transcribe/#pricing">Pricing</a>
      <a href="/business-suite/app/">Business Suite</a>
      <a href="/blog/" class="mobile-only-link">Blog</a>
      <a href="/account/" id="navAccountLink">Sign in</a>
    </div>
  </nav>
</header>

<div class="search-overlay" id="searchOverlay">
  <div class="search-panel">
    <div class="search-panel-head">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search tools..." autocomplete="off">
      <button class="search-close" id="searchClose" aria-label="Close search">&times;</button>
    </div>
    <div class="search-results" id="searchResults"></div>
    <div class="search-hint">↑↓ to navigate · Enter to open · Esc to close</div>
  </div>
</div>

<div class="tr-wrap">
  <div class="tr-top" id="pageHeader">
    <div>
      <h1 style="font-size:1.4rem;">Transcribe</h1>
      <p style="font-size:0.88rem; opacity:0.7; margin-top:4px;">Upload audio or video to get a transcript.</p>
    </div>
  </div>

  <div id="mainArea"><div class="empty-note">Loading…</div></div>
</div>

<div id="toast"></div>

<script type="module" src="/assets/auth.js"></script>
<script src="/assets/nav-auth.js" defer></script>
<script src="/assets/subscribe.js"></script>
<script src="/transcribe/app/guard.js"></script>
<script src="/transcribe/app/transcribe.js"></script>
<script src="/assets/tools-index.js" defer></script>
<script src="/assets/search.js" defer></script>
</body>
</html>
